<!doctype html><html lang="es">
  <head>

  <title>ENIGMA — Bienvenida</title><link rel="stylesheet" href="Diseño.css"></head>
  <body>
    <main class="pantalla"><div class="hero-login"></div>

        <button class="btn btn-primario">JUGAR</button>

      </section>

  </main>
      <script src="App.js"></script>
<script>
if(usuarioInvitado())location.href='index.html';document.querySelector('form').onsubmit=e=>{e.preventDefault();
const nombre=document.querySelector('input').value.trim();
if(!nombre)return;localStorage.setItem('enigma_invitado',JSON.stringify({id:'invitado-local',nombre}));location.href='index.html'}</script>
</body>
</html>
