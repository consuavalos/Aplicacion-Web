<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENIGMA — Conoce tu nivel</title><link rel="stylesheet" href="Diseño.css"><style>
 .eval-pasos{height:7px;border-radius:8px;background:rgba(120,130,150,.25);overflow:hidden;margin:18px 0}.eval-pasos i{display:block;height:100%;width:20%;background:linear-gradient(90deg,#f3a51c,#f9d55b);transition:width .2s}.eval-card{border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--panel);box-shadow:0 12px 30px rgba(0,0,0,.14)}.eval-kicker{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.08em}.eval-q{min-height:120px;display:grid;align-content:center;text-align:center;font-size:20px;line-height:1.5;white-space:pre-line}.eval-options{display:grid;gap:9px}.eval-choice{padding:13px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--text);font-size:15px;font-weight:700;text-align:left;cursor:pointer}.eval-choice:hover{border-color:var(--gold)}.eval-note{text-align:center;color:var(--muted);font-size:12px;line-height:1.5;margin:14px 0}.eval-result{text-align:center;padding:20px}.eval-result strong{font-size:27px;color:var(--gold)}body.tema-claro .eval-card,body.tema-claro .eval-choice{background:rgba(255,255,255,.9);color:#173d25;border-color:#b2c9a9}body.tema-claro .eval-note{color:#45664b}
 </style></head><body><main class="pantalla"><header class="encabezado"><a href="Login.html">‹</a><h2>EVALUACIÓN INICIAL</h2></header><p class="subtitulo">Cinco retos breves para ajustar tu punto de partida. No hay nota ni límite de tiempo.</p><div class="eval-pasos"><i id="avance"></i></div><section class="eval-card" id="panel"><div class="eval-kicker" id="numero"></div><div class="eval-q" id="pregunta"></div><div class="eval-options" id="opciones"></div></section><p class="eval-note">Tu resultado solo ajusta la dificultad inicial. Puedes avanzar a tu ritmo y volver a practicar cualquier habilidad.</p></main><script src="App.js"></script><script>
if(!usuarioInvitado())location.href='Login.html';else{
 const retos=[
  {h:1,q:'Todos los lumis llevan una llave. Nara es un lumi. ¿Qué podemos deducir?',o:['Nara lleva una llave','Nara vive en una cueva','No se puede saber'],a:0},
  {h:2,q:'Completa el patrón: 2 · 5 · 8 · 11 · ?',o:['12','14','15'],a:1},
  {h:6,q:'Si 4 cajas iguales contienen 36 piezas en total, ¿cuántas hay en cada caja?',o:['8','9','10'],a:1},
  {h:3,q:'Observa y recuerda el orden:\n🌙 · 🔑 · 💎 · 🍃',o:['🌙 · 🔑 · 💎 · 🍃','🌙 · 💎 · 🔑 · 🍃','🔑 · 🌙 · 💎 · 🍃'],a:0,m:true},
  {h:7,q:'¿Qué orden ayuda a resolver una tarea con un programa?',o:['Probar al azar, luego pensar','Entender el objetivo, ordenar pasos, ejecutar','Ejecutar y borrar los pasos'],a:1}
 ];let actual=0,puntaje=0;const estado=leerEstado();if(estado.evaluacionCompleta)location.href='index.html';
 function mostrar(){const r=retos[actual];avance.style.width=`${(actual+1)/retos.length*100}%`;numero.textContent=`RETO ${actual+1} DE ${retos.length}`;pregunta.textContent=r.q;opciones.innerHTML=r.o.map((x,i)=>`<button class="eval-choice" data-i="${i}">${x}</button>`).join('');if(r.m)setTimeout(()=>{if(actual===3)pregunta.textContent='¿Cuál era el orden de los símbolos?';},4000);opciones.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(+b.dataset.i===r.a)puntaje++;actual++;if(actual<retos.length)mostrar();else terminar()})}
 function terminar(){const inicial=puntaje<=1?1:puntaje<=3?2:3;estado.dificultadInicial=inicial;estado.evaluacionCompleta=true;estado.fechaEvaluacion=new Date().toISOString();estado.niveles=estado.niveles||{};HABILIDADES.forEach(h=>{estado.niveles[h.id]=Math.max(estado.niveles[h.id]||1,inicial);estado.progreso[h.id]=Math.max(estado.progreso[h.id]||0,(inicial-1)*5)});guardarEstado(estado);panel.innerHTML=`<div class="eval-result"><div style="font-size:44px">${inicial===1?'🌱':inicial===2?'🧠':'🚀'}</div><div class="eval-kicker">PUNTO DE PARTIDA</div><h2>Nivel inicial ${inicial}</h2><p>${puntaje} de ${retos.length} respuestas correctas. Elegimos una dificultad para empezar; podrás subirla paso a paso.</p><a class="btn btn-primario" style="display:block;text-decoration:none;padding:14px;border-radius:10px" href="index.html">Comenzar a jugar</a></div>`;document.querySelector('.eval-note').textContent='¡Listo! No hay presión por mantener un resultado: cada modo se adapta conforme practicas.'}mostrar();
}
</script></body></html>
