<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENIGMA — Modos</title><link rel="stylesheet" href="Diseño.css"></head><body><main class="pantalla"><header class="encabezado"><a href="home.html">‹</a><h2>MODOS DE ENTRENAMIENTO</h2></header><p class="subtitulo">Elige una habilidad para entrenar</p><section id="lista"></section></main><script src="App.js"></script><script>if(exigirUsuario()){const e=leerEstado();lista.innerHTML=HABILIDADES.map(h=>`<a class="modo-card" href="mapa.html?habilidad=${h.id}"><div class="modo-icono" style="color:${h.color}">${h.icono}</div><div class="modo-info"><h3>${h.nombre}</h3><div class="modo-meta"><span>Nivel ${Math.max(1,Math.ceil((e.progreso[h.id]||0)/20))}</span><div class="mini-barra"><i style="width:${e.progreso[h.id]||0}%;background:${h.color}"></i></div></div></div><span class="modo-pct">${e.progreso[h.id]||0}%</span></a>`).join('');document.body.insertAdjacentHTML('beforeend',navInferior('habilidades'))}</script></body></html>
