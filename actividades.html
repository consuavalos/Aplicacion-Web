<html lang="es">
<head>

  <title>ENIGMA — Laboratorio de actividades</title><link rel="stylesheet" href="Diseño.css">
  <style>
    .lab-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}.lab-head a{color:var(--text);font-size:28px;text-decoration:none}.lab-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.lab-stat,.lab-card,.lab-feedback{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:12px}.lab-stat{text-align:center;font-weight:800}.lab-stat small{display:block;color:var(--muted);font-size:10px}.lab-meter{height:7px;background:rgba(120,130,150,.25);border-radius:9px;overflow:hidden;margin:10px 0}.lab-meter i{height:100%;display:block;background:linear-gradient(90deg,#f3a51c,#f9d55b);transition:width .25s}.lab-card h2{font-size:15px;color:var(--gold);margin:2px 0 12px}.lab-prompt{font-size:17px;line-height:1.5;white-space:pre-line;text-align:center;margin:12px 0 18px}.lab-hint{color:var(--muted);font-size:12px;text-align:center}.lab-options{display:grid;gap:8px}.lab-choice,.lab-action,.lab-chip,.lab-grid-cell{border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--text);padding:12px;font-weight:700;cursor:pointer}.lab-choice{text-align:left}.lab-choice:hover,.lab-chip:hover,.lab-grid-cell:hover{border-color:var(--gold)}.lab-choice.selected,.lab-chip.selected{outline:2px solid var(--gold)}.lab-input{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:13px;width:100%;font:inherit}.lab-actions{display:flex;gap:8px;margin-top:12px}.lab-action{flex:1;background:linear-gradient(#ffc23e,#e9920d);color:#211700;border:0}.lab-action.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.lab-order{display:grid;gap:7px}.lab-order-row{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);touch-action:pan-y}.lab-order-row.dragging{opacity:.45}.lab-order-row span{flex:1;font-weight:700}.lab-order-row button{border:0;border-radius:7px;background:transparent;color:var(--text);font-size:17px;padding:4px 8px;cursor:pointer}.lab-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:260px;margin:12px auto}.lab-grid-cell{aspect-ratio:1;font-size:21px}.lab-grid-cell.lit{background:#ffe27c;color:#302000;box-shadow:0 0 18px #ffce36}.lab-grid-cell.chosen{background:#4d9b70}.lab-feedback{margin-top:12px;line-height:1.5}.lab-feedback.good{border-color:#55ad70}.lab-feedback.bad{border-color:#db665b}.lab-timer{font-weight:800;color:var(--gold);text-align:right}.lab-swatches{display:flex;justify-content:center;gap:9px;margin:10px}.lab-swatch{width:44px;height:44px;border:3px solid rgba(255,255,255,.35);border-radius:50%;cursor:pointer}.lab-code{font-size:24px;text-align:center;letter-spacing:8px;margin:10px}.lab-daily{font-size:12px;color:var(--muted);text-align:center;margin-bottom:10px}.lab-end{text-align:center;padding:16px}.lab-end .emoji{font-size:42px}.lab-end h2{color:var(--gold)}
    body.tema-claro .lab-stat,body.tema-claro .lab-card,body.tema-claro .lab-feedback{background:rgba(255,255,255,.88);box-shadow:0 5px 18px rgba(50,95,48,.08)}body.tema-claro .lab-choice,body.tema-claro .lab-action.secondary,body.tema-claro .lab-order-row,body.tema-claro .lab-grid-cell,body.tema-claro .lab-input{background:#fff;color:#173d25;border-color:#b2c9a9}body.tema-claro .lab-hint,body.tema-claro .lab-stat small,body.tema-claro .lab-daily{color:#45664b}
  </style>

<body><main class="pantalla">
  <header class="lab-head"><a id="volver" href="mapa.html">‹</a><h2>LABORATORIO MENTAL</h2></header>
  <p class="subtitulo" id="subtitulo">Cinco retos distintos. Cada sesión cambia.</p>
  <div class="lab-stats"><div class="lab-stat">🪙 <span id="monedas">0</span><small>Monedas</small></div><div class="lab-stat">🔥 <span id="racha">0</span><small>Seguidos</small></div><div class="lab-stat">⭐ <span id="estrellas">0</span><small>Estrellas</small></div></div>
  <div class="lab-meter"><i id="progreso" style="width:0%"></i></div>
  <section id="juego" class="lab-card"></section>
  <div id="feedback" class="lab-feedback oculto" aria-live="polite"></div>
</main>
<script src="App.js"></script><script>
if(exigirUsuario()){
 const params=new URLSearchParams(location.search),id=+(params.get('habilidad')||1),hab=HABILIDADES.find(h=>h.id===id)||HABILIDADES[0];let estado=leerEstado();
 volver.href=`mapa.html?habilidad=${id}`;document.getElementById('subtitulo').textContent=`${hab.nombre} · nivel ${Math.min(20,(estado.niveles?.[id]||1))} · hoy: ${retoDiarioActual().titulo}`;
 let nivel=Math.max(1,Math.min(20,(estado.niveles?.[id]||1))),falladas=Array.isArray(estado.repasos?.[id])?estado.repasos[id]:[],session=[],index=0,correctas=0,fallos=0,combo=0,seleccion=null,answerLocked=false,timer=null,seconds=0,activityStarted=0,codeGuesses=0,codeSecret=[];const monedasInicio=estado.monedas||0;
 const dificultad=Math.min(5,Math.floor((nivel-1)/4)),modoExperto=params.get('experto')==='1'&&(estado.contenidoDesbloqueado||[]).includes('modo-experto');
 const tiempoExtra=estado.inventario?.tiempoExtra>0;if(tiempoExtra){estado.inventario.tiempoExtra--;guardarEstado(estado)}
 const timeLimit=Math.max(8,24-dificultad*3-(modoExperto?5:0))+(tiempoExtra?10:0);
 function rand(n){return Math.floor(Math.random()*n)} function pick(a){return a[rand(a.length)]} function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
 function choice(prompt,options,answer,why,kind='choice'){return {kind,prompt,options,answer,why}}
 function makeTask(){
  const n=3+dificultad,letter=String.fromCharCode(65+rand(8)),x=2+rand(8)+dificultad,y=2+rand(8),colors=['🔴','🔵','🟢','🟡','🟣'],words=['luna','llave','cristal','búho','río','pluma','nube','gema','faro','hoja','zorro','torre'];
  const categories={
   1:[
    ()=>{const names=shuffle(['revisar las pistas','comparar opciones','descartar contradicciones','elegir la única posibilidad']);return {kind:'order',prompt:'Ordena los pasos para resolver un acertijo con pistas.',items:names,answer:['revisar las pistas','comparar opciones','descartar contradicciones','elegir la única posibilidad'],why:'Primero se reúne la información; luego se comparan opciones y se descartan contradicciones antes de concluir.'}},
    ()=>choice('Verdadero o falso: si todos los '+(letter==='A'?'naris':'lumis')+' tienen una estrella y '+letter+' pertenece al grupo, '+letter+' tiene una estrella.',['Verdadero — la regla se aplica a cada integrante','Falso — faltan más datos'],0,'La palabra “todos” incluye a cada miembro del grupo; por eso la propiedad también se cumple para '+letter+'.'),
    ()=>choice('¿Qué conclusión se deduce? '+letter+' llega antes que B; B llega antes que C.',['C llega antes que '+letter,' '+letter+' llega antes que C','B llega después de C'],1,'Si A precede a B y B precede a C, entonces A también precede a C.')
   ],
   2:[
    ()=>{const start=1+rand(8),step=1+rand(5)+dificultad,seq=[0,1,2,3].map(i=>start+i*step),ans=start+4*step,opts=shuffle([ans,ans+step,ans-step,ans+2*step]);return choice(`Toca la pieza que completa el patrón:\n${seq.join(' · ')} · ?`,opts.map(String),opts.indexOf(ans),`Cada paso suma ${step}. Después de ${seq[3]} viene ${ans}.`,'visual')},
    ()=>{const step=1+rand(4),seq=[1,2,3,4,5].map(v=>v*step),items=shuffle(seq.map(String));return {kind:'order',prompt:`Arrastra las fichas y completa la serie de menor a mayor.`,items,answer:seq.map(String),why:`La serie aumenta de ${step} en ${step}: ${seq.join(' → ')}.`}},
    ()=>choice('Mira el patrón: 🔺 🔵 🔺 🔵 🔺 ¿qué sigue?',['🔺','🔵','🟩'],1,'Las dos figuras se alternan: después del triángulo va el círculo.')
   ],
   3:[
    ()=>{const cells=Array.from({length:16},(_,i)=>i),target=shuffle(cells).slice(0,Math.min(3+dificultad,7)),sitios=target.map(i=>`fila ${Math.floor(i/4)+1}, columna ${(i%4)+1}`);return {kind:'grid',prompt:'Memoriza las casillas iluminadas. Se ocultarán en un segundo; luego tócalas.',target,why:`Las casillas estaban en ${sitios.join('; ')}. Agrupar las posiciones por filas ayuda a recordarlas.`}},
    ()=>{const list=shuffle(words).slice(0,3+dificultad);return {kind:'recall',prompt:`Memoriza esta lista. Desaparecerá en un momento.`,list,why:`La lista era: ${list.join(', ')}. Repetirla mentalmente o agruparla ayuda a recordarla.`}},
    ()=>{const list=shuffle(colors).slice(0,3);return {kind:'recall',prompt:'Recuerda los colores en orden.',list,why:`El orden era ${list.join(' → ')}. Asociar cada color con una imagen puede ayudar.`}}
   ],
   4:[
    ()=>{const grid=['1 · _ · 3 · 4','3 · 4 · 1 · _','_ · 1 · 4 · 3','4 · 3 · _ · 1'],row=rand(4),col=[1,3,0,2][row],answer=['2','2','2','2'][row];return choice(`Mini sudoku 4×4: cada fila usa 1, 2, 3 y 4 una vez. Completa el espacio vacío:\n${grid[row]}`,shuffle(['1','2','3','4']),null,`En esa fila faltan los números que no aparecen; el que completa la fila es ${answer}.`,'sudoku')},
    ()=>{const colors2=shuffle(colors).slice(0,4),secret=shuffle(colors2).slice(0,4);codeGuesses=0;return {kind:'mastermind',prompt:'Adivina el código de 4 colores. Tras cada intento verás cuántos están bien ubicados y cuántos están en otra posición.',colors:colors2,secret,why:`El código era ${secret.join(' ')}. “Bien ubicado” significa mismo color y posición; “mal ubicado” significa que el color está, pero en otra posición.`}},
    ()=>choice('En una casa viven Ana, Beto y Ciro. Ana no vive en la casa azul. Beto vive en la roja. ¿Quién vive en la azul?',['Ana','Beto','Ciro'],2,'Beto ocupa la roja y Ana no puede estar en la azul; por eliminación, Ciro vive en la azul.')
   ],
   5:[
    ()=>{const budget=10+2*dificultad,food=3+rand(3),transport=2+rand(2),rest=budget-food-transport;return choice(`Tienes ${budget} monedas. La comida cuesta ${food}, el transporte ${transport} y guardar al menos 2 de reserva es obligatorio. ¿Qué presupuesto completo es válido?`,[`Comida ${food}, transporte ${transport}, reserva ${rest}`,`Comida ${food+1}, transporte ${transport}, reserva ${rest-1}`,`Comida ${food}, transporte ${transport+1}, reserva ${rest-1}`],0,`La opción válida gasta ${food}+${transport} y reserva ${rest}; así no supera ${budget} y mantiene la reserva mínima.`)},
    ()=>choice('Ruta óptima: la ruta del bosque cuesta 4 + 3 monedas; la del río cuesta 5 + 1. ¿Cuál cuesta menos?',['Bosque: 7','Río: 6','Cuestan igual'],1,'Sumamos los costos de cada tramo: el río cuesta 6, menos que 7.'),
    ()=>choice('La puerta se cerrará en 2 turnos. Puedes tomar la llave (1 turno) y abrirla (1 turno), o buscar un tesoro (2 turnos). ¿Qué decisión permite salir?',['Buscar el tesoro','Tomar la llave y abrir la puerta','Esperar'],1,'La llave y la puerta ocupan exactamente los dos turnos disponibles; buscar el tesoro no acerca a la salida.')
   ],
   6:[
    ()=>{const a=2+rand(8),b=2+rand(8),ans=a+b;return {kind:'equation',prompt:`Arrastra los bloques para formar una ecuación que dé ${ans}.`,items:shuffle([String(a),'+',String(b),'=',String(ans)]),answer:[String(a),'+',String(b),'=',String(ans)],why:`${a} + ${b} = ${ans}. El signo y los números deben conservar ese orden.`}},
    ()=>{const a=3+rand(18),b=2+rand(9),ans=a*b,margin=Math.max(3,Math.round(ans*.08));return {kind:'number',prompt:`Estimación rápida: ¿cuánto es aproximadamente ${a} × ${b}? (margen ±${margin})`,answer:ans,margin,why:`El resultado exacto es ${a} × ${b} = ${ans}; una estimación cercana dentro del margen cuenta.`}},
    ()=>{const a=2+rand(9),b=2+rand(9);return {kind:'number',prompt:`Contra reloj: ¿cuánto es ${a} × ${b}?`,answer:a*b,why:`${a} grupos de ${b} suman ${a*b}.`}},
    ()=>{const a=10+rand(20),b=2+rand(8);return {kind:'number',prompt:`Resuelve la incógnita: x + ${b} = ${a}. Escribe x.`,answer:a-b,why:`Restamos ${b} a ambos lados: x = ${a} − ${b} = ${a-b}.`}}
   ],
   7:[
    ()=>{const items=shuffle(['Avanzar 3 pasos','Girar a la derecha','Avanzar 2 pasos','Recoger la estrella']);return {kind:'order',prompt:'Ordena los bloques para que el robot llegue a la estrella y la recoja.',items,answer:['Avanzar 3 pasos','Girar a la derecha','Avanzar 2 pasos','Recoger la estrella'],why:'El robot primero avanza, luego gira, llega hasta la estrella y finalmente la recoge.'}},
    ()=>choice('El robot debe avanzar 4 pasos, pero el bloque dice “avanza 3”. Toca el error.',['Repetir 4 veces','Avanzar 3 pasos','Girar a la derecha'],1,'El bloque avanza solo 3 pasos; falta uno para cumplir el objetivo de avanzar 4.'),
    ()=>{const items=shuffle(['🔴','🔵','🟢','🟡']);return {kind:'order',prompt:'Clasifica los colores en el orden indicado: amarillo, azul, rojo, verde.',items,answer:['🟡','🔵','🔴','🟢'],why:'Ordenar elementos exige comparar cada uno y moverlo hasta la posición objetivo.'}},
    ()=>choice('¿Qué bloque repite una acción varias veces?',['si / entonces','repetir 4 veces','guardar variable'],1,'Un bloque “repetir” ejecuta las instrucciones de su interior varias veces.')
   ]
  };
  if(id===1&&(estado.contenidoDesbloqueado||[]).includes('pack-logica'))categories[1].push(()=>choice('Reto avanzado: tres interruptores controlan una lámpara en otra habitación. Solo puedes entrar una vez. ¿Qué dato extra te permite identificar el interruptor correcto?', ['La lámpara conserva calor después de apagarse','El color de la puerta','La hora del día'],0,'Enciendes un interruptor unos minutos, lo apagas, enciendes otro y entras: la lámpara encendida corresponde al segundo; la tibia, al primero.'));
  if((estado.contenidoDesbloqueado||[]).includes('pack-temporada'))categories[id].push(()=>choice('Reto de temporada: dos calabazas pesan 7 kg cada una y una tercera pesa 2 kg menos. ¿Cuánto pesan entre todas?', ['17 kg','19 kg','21 kg'],1,'La tercera calabaza pesa 7 − 2 = 5 kg. En total: 7 + 7 + 5 = 19 kg.'));
  const pool=categories[id]||categories[1];return pool[rand(pool.length)]();
 }
 function buildSession(){session=Array.from({length:5},makeTask);if(falladas.length){const review=falladas.shift();session.splice(Math.min(2,session.length),0,{...review,review:true});} }
 buildSession();render();
 function render(){clearInterval(timer);answerLocked=false;seleccion=null;const task=session[index];if(!task){finish();return}document.getElementById('progreso').style.width=`${Math.min(100,index/session.length*100)}%`;document.getElementById('monedas').textContent=estado.monedas||0;document.getElementById('estrellas').textContent=estado.estrellas||0;document.getElementById('racha').textContent=combo;
  const box=document.getElementById('juego'),feedback=document.getElementById('feedback');feedback.classList.add('oculto');let extra=task.review?'<p class="lab-hint">↻ REPASO ESPACIADO: vuelve una pregunta que fallaste</p>':'';
  box.innerHTML=`<div class="lab-timer">⏱ <span id="reloj">${timeLimit}</span>s ${modoExperto?'· EXPERTO':''}</div><h2>${hab.icono} ${hab.nombre.toUpperCase()} · RETO ${index+1}</h2>${extra}<p class="lab-prompt">${task.prompt}</p><div id="interaccion"></div><div class="lab-actions"><button id="comprobar" class="lab-action">Comprobar</button>${estado.inventario?.saltarPregunta>0?'<button id="saltar" class="lab-action secondary">Saltar sin perder vida</button>':''}</div>`;
  const ui=document.getElementById('interaccion');
  if(task.kind==='choice'||task.kind==='visual'||task.kind==='sudoku'){let opts=task.options||[];if(task.kind==='sudoku'){const ans=task.why.match(/es (\d)\./)?.[1]||'2';task.answer=opts.indexOf(ans)}ui.innerHTML=`<div class="lab-options">${opts.map((o,i)=>`<button class="lab-choice" data-index="${i}">${o}</button>`).join('')}</div>`;ui.querySelectorAll('.lab-choice').forEach(b=>b.onclick=()=>{ui.querySelectorAll('.lab-choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');seleccion=+b.dataset.index});}
  else if(task.kind==='number'){ui.innerHTML='<input class="lab-input" id="respuestaNumero" inputmode="decimal" autocomplete="off" placeholder="Escribe tu respuesta">';}
  else if(task.kind==='order'||task.kind==='equation'){ui.innerHTML=`<p class="lab-hint">Arrastra para reordenar; también puedes usar ↑ y ↓.</p><div class="lab-order">${task.items.map((it,i)=>`<div class="lab-order-row" draggable="true" data-index="${i}"><span>${it}</span><button type="button" data-move="-1" aria-label="Subir">↑</button><button type="button" data-move="1" aria-label="Bajar">↓</button></div>`).join('')}</div>`;enableOrdering(ui);}
  else if(task.kind==='grid'){ui.innerHTML=`<div class="lab-grid">${Array.from({length:16},(_,i)=>`<button class="lab-grid-cell" data-cell="${i}"></button>`).join('')}</div>`;setTimeout(()=>{if(index>=session.length)return;ui.querySelectorAll('.lab-grid-cell').forEach(b=>{if(task.target.includes(+b.dataset.cell)){b.classList.add('lit');b.textContent='✦'}});setTimeout(()=>ui.querySelectorAll('.lab-grid-cell').forEach(b=>{b.classList.remove('lit');b.textContent='·'}),1000)},100);ui.querySelectorAll('.lab-grid-cell').forEach(b=>b.onclick=()=>{b.classList.toggle('chosen');b.textContent=b.classList.contains('chosen')?'✦':'·'});}
  else if(task.kind==='recall'){ui.innerHTML=`<div class="lab-code" id="listaVisible">${task.list.join(' · ')}</div><input class="lab-input" id="respuestaLista" autocomplete="off" placeholder="Escribe los elementos en orden, separados por coma">`;setTimeout(()=>{const el=document.getElementById('listaVisible');if(el&&index<session.length)el.textContent='…';},Math.max(1500,3000-dificultad*250));}
  else if(task.kind==='mastermind'){ui.innerHTML=`<p class="lab-hint">Intento <span id="intentosCodigo">0</span>/6</p><div class="lab-code" id="codigoActual">○ ○ ○ ○</div><div class="lab-swatches">${task.colors.map((c,i)=>`<button class="lab-swatch" data-color="${c}" style="background:${{ '🔴':'#e74a4a','🔵':'#4682e7','🟢':'#43b26a','🟡':'#e5c535','🟣':'#a75bc5'}[c]}" aria-label="${c}"></button>`).join('')}</div><div id="pistasCodigo" class="lab-hint"></div>`;seleccion=[];ui.querySelectorAll('.lab-swatch').forEach(b=>b.onclick=()=>{if(seleccion.length>=4)seleccion.shift();seleccion.push(b.dataset.color);document.getElementById('codigoActual').textContent=seleccion.join(' ')});}
  activityStarted=Date.now();seconds=timeLimit;timer=setInterval(()=>{seconds--;const clk=document.getElementById('reloj');if(clk)clk.textContent=seconds;if(seconds<=0){clearInterval(timer);submit(false,true)}},1000);
  document.getElementById('comprobar').onclick=()=>submit(true,false);
  const saltar=document.getElementById('saltar');if(saltar)saltar.onclick=()=>{if(!usarPotenciador('saltarPregunta'))return;estado=leerEstado();clearInterval(timer);if(task.review)falladas.push(task);guardarEstado({...estado,repasos:{...(estado.repasos||{}),[id]:falladas}});index++;render()};
 }
 function enableOrdering(ui){let dragged=null;const rows=()=>[...ui.querySelectorAll('.lab-order-row')];function reorder(a,b){const list=rows(),from=list.indexOf(a),to=list.indexOf(b);if(from<0||to<0||from===to)return;const target=list[to];if(from<to)target.after(a);else target.before(a)}rows().forEach(row=>{row.ondragstart=()=>{dragged=row;row.classList.add('dragging')};row.ondragend=()=>{dragged=null;row.classList.remove('dragging')};row.ondragover=e=>e.preventDefault();row.ondrop=e=>{e.preventDefault();if(dragged)reorder(dragged,row)};row.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const list=rows(),i=list.indexOf(row),to=i+ +b.dataset.move;if(to>=0&&to<list.length){if(to<i)list[to].before(row);else list[to].after(row)}})});}
 function submit(clicked,timeout){if(answerLocked)return;const task=session[index],ui=document.getElementById('interaccion');let ok=false,answerText='';
  if(task.kind==='choice'||task.kind==='visual'||task.kind==='sudoku'){ok=seleccion===task.answer;answerText=seleccion===null?'sin respuesta':task.options?.[seleccion]||''}
  else if(task.kind==='number'){const val=Number(document.getElementById('respuestaNumero')?.value);ok=Number.isFinite(val)&&(task.margin?Math.abs(val-task.answer)<=task.margin:val===task.answer);answerText=String(val)}
  else if(task.kind==='order'||task.kind==='equation'){const arr=[...ui.querySelectorAll('.lab-order-row span')].map(x=>x.textContent);ok=arr.length===task.answer.length&&arr.every((x,i)=>x===task.answer[i]);answerText=arr.join(' ')}
  else if(task.kind==='grid'){const picked=[...ui.querySelectorAll('.lab-grid-cell.chosen')].map(x=>+x.dataset.cell);ok=picked.length===task.target.length&&task.target.every(x=>picked.includes(x));answerText=`${picked.length} casillas`}
  else if(task.kind==='recall'){const raw=(document.getElementById('respuestaLista')?.value||'').toLocaleLowerCase().split(/[\s,;]+/).filter(Boolean);ok=raw.join('|')===task.list.map(x=>x.toLocaleLowerCase()).join('|');answerText=raw.join(', ')}
  else if(task.kind==='mastermind'){const guess=seleccion||[];codeGuesses++;document.getElementById('intentosCodigo').textContent=codeGuesses;let exact=0,misplaced=0;const left=[];guess.forEach((c,i)=>{if(c===task.secret[i])exact++;else left.push(c)});const remain=[...task.secret];guess.forEach((c,i)=>{if(c===task.secret[i])remain[i]=null});left.forEach(c=>{const j=remain.indexOf(c);if(j>=0){misplaced++;remain[j]=null}});document.getElementById('pistasCodigo').textContent=`${exact} correcto${exact===1?'':'s'} y bien ubicado · ${misplaced} correcto${misplaced===1?'':'s'} pero mal ubicado`;if(exact===4){ok=true}else if(codeGuesses<6){seleccion=[];document.getElementById('codigoActual').textContent='○ ○ ○ ○';return}else{ok=false}answerText=guess.join(' ')}
  if(task.kind==='mastermind'&&!ok&&codeGuesses<6)return;

 }
